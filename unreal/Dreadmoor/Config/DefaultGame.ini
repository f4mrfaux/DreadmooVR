[/Script/EngineSettings.GeneralProjectSettings]
ProjectName=Dreadmoor

[/Script/UnrealEd.ProjectPackagingSettings]
; Mod pak: everything under /Game/DreadmoorVR is chunk 1 via the PrimaryAssetLabel
; /Game/DreadmoorVR/PAL_DreadmoorVR and is cooked into its own IoStore container, which tools/cook.ps1 renames to DreadmoorVR_P.
BuildConfiguration=PPBC_Shipping
UsePakFile=True
bUseIoStore=True
bGenerateChunks=True
bShareMaterialShaderCode=False
+DirectoriesToAlwaysCook=(Path="/Game/DreadmoorVR")


; Stand-ins at game paths (skeleton, player mesh) and the UE template mannequin: never cooked.
; At runtime the cooked arms bind to the games real assets at the same paths.
+DirectoriesToNeverCook=(Path="/Game/3rdParty")
+DirectoriesToNeverCook=(Path="/Game/Dreadmoor")
+DirectoriesToNeverCook=(Path="/Game/Characters")
