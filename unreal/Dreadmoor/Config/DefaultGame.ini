[/Script/EngineSettings.GeneralProjectSettings]
ProjectName=Dreadmoor

[/Script/UnrealEd.ProjectPackagingSettings]
; Mod pak: everything under /Game/DreadmoorVR is chunk 1 (see AssetManagerSettings below) and
; is cooked into its own IoStore container, which tools/cook.ps1 renames to DreadmoorVR_P.
BuildConfiguration=PPBC_Shipping
UsePakFile=True
bUseIoStore=True
bGenerateChunks=True
bShareMaterialShaderCode=False

[/Script/Engine.AssetManagerSettings]
; Every Actor Blueprint under /Game/DreadmoorVR is a primary asset in chunk 1, always cooked.
; Whatever those reference is pulled into chunk 1 too, which is why tools/cook.ps1 checks the
; container for anything outside /Game/DreadmoorVR.
+PrimaryAssetTypesToScan=(PrimaryAssetType="DreadmoorVRMod",AssetBaseClass="/Script/Engine.Actor",bHasBlueprintClasses=True,bIsEditorOnly=False,Directories=((Path="/Game/DreadmoorVR")),Rules=(Priority=10,ChunkId=1,bApplyRecursively=True,CookRule=AlwaysCook))
